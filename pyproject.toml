[project]
name = "pydnp3-pure"
version = "0.1.0"
description = "Pure Python DNP3 protocol library supporting master and outstation roles"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Anand Todkar" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.1.1",
    "hypothesis==6.119.3",
    "mypy==1.14.1",
    "ruff==0.8.6",
    "twine==6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydnp3_pure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pydnp3_pure"]
mypy_path = "src"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
